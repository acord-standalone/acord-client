name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.ETOKEN }}
    REPO: acord-standalone/acord-client
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Acord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Collect commit metadata
              id: meta
              run: |
                  echo "commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
                  echo "commit_author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
                  echo "changed_files=$(git diff-tree --no-commit-id -r --name-only HEAD | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateAcordPluginJson dist/acordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Acord.user.{js,js.LEGAL.txt} release

                  # plugin data jsons, extension zips and desktop asar
                  cp *.{json,zip} release
                  cp desktop.asar release

                  # legacy un-asared files
                  cp desktop/* release

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload Acord Stable
              if: ${{ vars.ACT == 'false' }}
              run: |
                  gh release upload latest --clobber \
                    dist/release/desktop.asar \
                    dist/release/devs.json \
                    dist/release/plugins.json \
                    dist/release/equicordplugins.json \
                    dist/release/acordplugins.json \
                    dist/release/vencordplugins.json

            - name: Notify Discord
              if: ${{ vars.ACT == 'false' }}
              env:
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
                  CHANGED_FILES: ${{ steps.meta.outputs.changed_files }}
                  COMMIT_MESSAGE: ${{ steps.meta.outputs.commit_message }}
                  COMMIT_AUTHOR: ${{ steps.meta.outputs.commit_author }}
              run: node scripts/notifyBuild.mjs
